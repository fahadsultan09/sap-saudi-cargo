<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Console</title>
<style>:root{--ink:#1b2430;--mute:#5d6877;--line:#d9d6cc;--bg:#f3f2ee;--ok:#0f7b5f;--bad:#b3261e;--wait:#9a6700;--ai:#5b3fa0;--acc:#12456b}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
h1{font-size:18px;margin:0 0 8px}h2{font-size:13px;margin:0 0 8px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 11px;cursor:pointer;margin-right:6px}button:disabled{opacity:.4}button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:10px;background:#eee}.PASS,.CLOSED,.POSTED{color:var(--ok)}.FAIL,.REJECTED{color:var(--bad)}.UNKNOWN,.NEEDS_REVIEW,.WAITING_EXTERNAL{color:var(--wait)}
.grid{display:grid;grid-template-columns:230px 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.ai{background:#ece7f7;border-radius:6px;padding:8px 10px}.ev{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin-bottom:6px;font-size:12.5px}.ev.MODEL_JUDGEMENT{border-color:var(--ai)}.ev.HUMAN_DECISION{border-color:var(--acc)}.ev.RULE_RESULT{border-color:var(--wait)}.ev.SYSTEM_ACTION{border-color:var(--ok)}
.ev small{color:var(--mute);display:block}.case{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:8px}.case.sel{border-color:var(--acc)}</style></head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
