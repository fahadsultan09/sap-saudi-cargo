# Local identity server (plays SAP IAS + XSUAA). Start: docker compose -f infra/docker-compose.yml up -d
# The client profile's realm is imported on first start; secrets come from infra/.env (see .env.example).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      AP_PUBLIC_URL: ${AP_PUBLIC_URL:-http://localhost:8000}
      AP_GATEWAY_CLIENT_SECRET: ${AP_GATEWAY_CLIENT_SECRET}
      DEV_PASSWORD_FAIZAN: ${DEV_PASSWORD_FAIZAN}
      DEV_PASSWORD_FAIZAN_SALEEM: ${DEV_PASSWORD_FAIZAN_SALEEM}
    volumes:
      - ../clients/${CLIENT:-saudi-cargo}/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
