specVersion: "3.0"
metadata:
  name: saudicargo.ap.automation

type: application

server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: root-index
      beforeMiddleware: serveResources

framework:
  name: OpenUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.uxap
    - name: sap.ui.unified
---
specVersion: "3.0"
kind: extension
type: server-middleware
metadata:
  name: root-index
middleware:
  path: lib/rootIndex.js
